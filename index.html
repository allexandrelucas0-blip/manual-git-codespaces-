<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
  <meta charset="UTF-8"> 
  <title>AgroVenda Digital Cadastro</title>  <!-- TAREFA: coloque o nome do portal aqui --> 
  <!-- TAREFA: adicione o link para o style.css aqui --> 
</head> 
<body> 
 
  <div class="container">   <!-- TAREFA: defina o nome da classe do container --> 
	<h1>AgroVenda Digital</h1> 
	<h2>Criar sua conta</h2> 
 
	<form id="formCadastro"> 
 
  	<!-- TAREFA: crie o campo Nome Completo com label e input type="text" --> 
     <label for="nome">Nome Completo</label>
      <input
        type="text"
        id="nome"
        placeholder="Digite seu nome completo"
        required
      >
 
  	<!-- TAREFA: crie o campo E-mail com label e input type="email" --> 
 <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        placeholder="Digite seu e-mail"
        required
      >
 
  	<!-- TAREFA: crie o campo Senha com label e input type="password" --> 
   <label for="senha">Senha</label>
      <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
        required
      >
 
  	<!-- TAREFA: crie o botão Cadastrar --> 
  <button type="button" id="btnCadastrar">
        Cadastrar
      </button>
	</form> 
  </div> 
 
  <!-- TAREFA: adicione o link para o script.js aqui, antes de </body> --> 
   <script src="script.js"></script>
</body> 
</html>
